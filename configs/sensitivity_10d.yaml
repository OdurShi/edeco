# Sensitivity of the re-implementation to details the paper leaves open (this is NOT a
# paper experiment).  Eight CEC 2017 functions, D = 10, 3 runs.  Every entry changes
# exactly one setting of the default ECO / EDECO configuration.
name: sensitivity_10d
suite: cec2017
functions: [1, 3, 5, 6, 9, 10, 21, 23]
dim: 10
pop_size: 100
fes_per_dim: 5000
runs: 3
seed: 2025
workers: 4
algorithms:
  ECO: {}
  EDECO: {}
  ECO-N30: {base: ECO, pop_size: 30}
  EDECO-N30: {base: EDECO, pop_size: 30}
  ECO-N50: {base: ECO, pop_size: 50}
  EDECO-N50: {base: EDECO, pop_size: 50}
  ECO-paper-eqs: {base: ECO, base_equations: paper}
  DECO: {}
  DECO-eq19: {base: DECO, dfs_student_rule: eq19}
  EDECO-eq19: {base: EDECO, dfs_student_rule: eq19}
  EDECO-literal-w: {base: EDECO, dfs_weight_schedule: literal}
  EDECO-pairwise: {base: EDECO, eda_selection: pairwise}
  EDECO-NE-N: {base: EDECO, eda_sample_ratio: 1.0}
  EDECO-Nd-0.3N: {base: EDECO, dominant_ratio: 0.3}
